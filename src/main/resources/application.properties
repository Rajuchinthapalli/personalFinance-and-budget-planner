server.port=8080
server.servlet.context-path=/api

# Default: embedded H2 file database (no install needed). Use --spring.profiles.active=mysql for MySQL.
spring.datasource.url=jdbc:h2:file:./data/fintrack
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-12345}
app.jwt.expiration-ms=86400000
