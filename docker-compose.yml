services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fintrack
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: fintrack-backend/fintrack-backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: db
      DB_NAME: fintrack
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: please-change-this-to-a-long-random-secret-value-123456
    ports: ["8082:8080"]
